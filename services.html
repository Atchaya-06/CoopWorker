<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services - CoopConnect AI</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <i class="fas fa-hands-helping text-primary"></i>
                CoopConnect <span>AI</span>
            </a>
            
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="services.html" style="color: var(--primary);">Services</a>
            </div>

            <div class="flex items-center gap-4">
                <a href="customer.html" class="btn btn-primary">Go to Dashboard</a>
            </div>
        </div>
    </nav>

    <section class="section section-light" style="min-height: calc(100vh - 80px);">
        <div class="container">
            <div class="section-title">
                <h2>All Cooperative Services</h2>
                <p>Browse our complete list of verified, trusted local services.</p>
            </div>
            
            <div class="grid grid-cols-4 gap-6" id="allServicesGrid">
                <!-- Populated by JS -->
            </div>
        </div>
    </section>

    <script src="js/data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('allServicesGrid');
            if (!grid) return;
            
            DATA.services.forEach(service => {
                const div = document.createElement('div');
                div.className = 'card animate-fade-in-up';
                div.style.textAlign = 'center';
                div.style.cursor = 'pointer';
                div.innerHTML = `
                    <div style="width: 64px; height: 64px; margin: 0 auto 1.5rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.75rem; background: ${service.color}20; color: ${service.color}; transition: all 0.3s ease;">
                        <i class="fas ${service.icon}"></i>
                    </div>
                    <h3 style="font-size: 1.25rem; margin-bottom: 0.75rem;">${service.name}</h3>
                    <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.5rem;">${service.desc}</p>
                    <span style="color: var(--primary); font-weight: 600; font-size: 0.875rem;">Book Now <i class="fas fa-chevron-right"></i></span>
                `;
                
                div.addEventListener('click', () => {
                    window.location.href = 'customer.html';
                });
                
                grid.appendChild(div);
            });
        });
    </script>
</body>
</html>
